name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:win
        env:
          NODE_ENV: production

      - name: Get version from tag
        id: tag_name
        run: |
          $VERSION=${{ github.ref }}.replace('refs/tags/v', '')
          echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/DuplicateClear-*.exe
          body: |
            # DuplicateClear v${{ steps.tag_name.outputs.VERSION }}

            ## Downloads
            - **Installer** (.exe) - Recommended for most users
            - **Portable** (.exe) - No installation required

            ## Installation

            ### For Installer
            1. Download `DuplicateClear-${{ steps.tag_name.outputs.VERSION }}.exe`
            2. Run the installer
            3. Follow the setup wizard

            ### For Portable
            1. Download `DuplicateClear-${{ steps.tag_name.outputs.VERSION }}-portable.exe`
            2. Run directly (no installation)

            ---
            **Changes in this release:**
            - Check the commits for details

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
